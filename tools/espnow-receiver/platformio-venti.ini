[platformio]
build_cache_dir = .cache
default_envs = venti_s3fn8

[env:venti_s3fn8]
; Coherent Arduino 3.3.12 / IDF 5.5.5 bundle, including later TinyUSB fixes.
; Pin the release instead of following the upstream moving "stable" alias.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = venti_s3fn8
board_build.variants_dir = variants
monitor_speed = 115200
monitor_echo = yes
lib_deps = rlogiacco/CircularBuffer@1.4.0
build_flags =
  -std=gnu++2a
  -DFIRMWARE_VERSION='"venti-espnow-test7"'
build_unflags = -std=gnu++11 -std=gnu++17

