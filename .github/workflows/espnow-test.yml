name: Venti ESP-NOW test builds

on:
  push:
    branches: [test/venti-espnow]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venti-espnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracker:
    if: github.ref == 'refs/heads/test/venti-espnow'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32c3, esp32c3_espnow]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: venti-espnow-pio-v1-${{ matrix.environment }}
      - name: Build tracker
        env:
          FIRMWARE_VERSION: 0.7.4-espnow-test2
        run: pio run -e ${{ matrix.environment }}
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/firmware.elf
            .pio/build/${{ matrix.environment }}/bootloader.bin
            .pio/build/${{ matrix.environment }}/partitions.bin

  receiver:
    if: github.ref == 'refs/heads/test/venti-espnow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: venti-espnow-pio-v1-receiver
      - run: python tools/espnow-receiver/prepare.py .receiver-build
      - name: Test channel selection with ESP_OK and failure results
        run: python tools/espnow-receiver/test_channel_config.py .receiver-build
      - name: Test USB serial backpressure and reconnect
        run: python tools/espnow-receiver/test_serial_backpressure.py .receiver-build
      - name: Test deferred radio callbacks and ten-tracker scheduling
        run: python tools/espnow-receiver/test_receive_queue.py .receiver-build
      - name: Test USB idle keep-alives, backpressure and bounded console input
        run: python tools/espnow-receiver/test_usb_transport.py .receiver-build
      - name: Build receiver
        run: pio run -d .receiver-build -e venti_s3fn8
      - name: Validate and merge receiver image
        run: python scripts/package_espnow_receiver.py .receiver-build/.pio/build/venti_s3fn8
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-venti-s3fn8
          path: |
            .receiver-build/.pio/build/venti_s3fn8/firmware.bin
            .receiver-build/.pio/build/venti_s3fn8/firmware.elf
            .receiver-build/.pio/build/venti_s3fn8/bootloader.bin
            .receiver-build/.pio/build/venti_s3fn8/partitions.bin
            .receiver-build/.pio/build/venti_s3fn8/receiver-full-at-0x0.bin
            .receiver-build/.pio/build/venti_s3fn8/SHA256SUMS.txt
